name: herdr-win nightly

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: herdr-win-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  ARTIFACT_NAME: herdr-windows-x86_64
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Replay, test, and package Windows
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      upstream_sha: ${{ steps.source.outputs.upstream_sha }}
      control_sha: ${{ steps.source.outputs.control_sha }}
      build_id: ${{ steps.source.outputs.build_id }}
    steps:
      - name: Checkout herdr-win control repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: control
          persist-credentials: false

      - name: Checkout upstream Herdr
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ogulcancelik/herdr
          ref: master
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Record immutable source identity
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $upstream = (git -C source rev-parse HEAD).Trim()
          $control = (git -C control rev-parse HEAD).Trim()
          $buildId = "$($upstream.Substring(0, 12)).$($control.Substring(0, 12))"
          "upstream_sha=$upstream" >> $env:GITHUB_OUTPUT
          "control_sha=$control" >> $env:GITHUB_OUTPUT
          "build_id=$buildId" >> $env:GITHUB_OUTPUT
          "HERDR_BUILD_CHANNEL=nightly" >> $env:GITHUB_ENV
          "HERDR_BUILD_ID=$buildId" >> $env:GITHUB_ENV
          "HERDR_BUILD_COMMIT=$upstream" >> $env:GITHUB_ENV

      - name: Validate and replay maintained delta
        shell: pwsh
        env:
          GIT_COMMITTER_NAME: herdr-win replay
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          $ErrorActionPreference = "Stop"
          $base = (git -C ..\source rev-parse HEAD).Trim()
          python -m unittest scripts.test_delta_patches scripts.test_upstream_patches
          if ($LASTEXITCODE -ne 0) {
            throw "patch inventory validation failed with exit code $LASTEXITCODE"
          }
          $entries = @(
            Get-Content -LiteralPath patches\delta\series |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith("#") }
          )
          foreach ($entry in $entries) {
            $patch = (Resolve-Path -LiteralPath (Join-Path "patches\delta" $entry)).Path
            & git -C ..\source am --3way $patch
            if ($LASTEXITCODE -ne 0) {
              & git -C ..\source am --abort 2>$null
              throw "failed to replay $entry on upstream master"
            }
          }
          & git -C ..\source diff --check "$base..HEAD"
          if ($LASTEXITCODE -ne 0) {
            throw "replayed delta failed git diff --check"
          }
        working-directory: control

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt,clippy
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: herdr-win-nightly
          workspaces: source

      - name: Run Windows checks
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m unittest scripts.test_package_windows_conpty
          cargo fmt --check
          cargo clippy --bin herdr --locked --target $env:WINDOWS_TARGET -- -D warnings
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr windows_
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr remote::attach::tests
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr raw_input::tests
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr client::input
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr host_color
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr pane::cursor::tests
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr cursor_color
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr terminal_restore_postlude
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr host_theme_update_preserves_cursor
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr host_terminal_theme_restore_probe
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr restore_host_terminal_theme
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr render_ansi::tests
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr app_theme_
          cargo test --locked --target $env:WINDOWS_TARGET --bin herdr client_input_events_roundtrip

      - name: Build release executable
        working-directory: source
        run: cargo build --release --locked --target ${{ env.WINDOWS_TARGET }}

      - name: Verify system ConPTY fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "source\target\$env:WINDOWS_TARGET\release\herdr.exe"
          .\source\scripts\windows_smoke_conpty_path.ps1 `
            -ExePath $exe `
            -Session "nightly-system-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

      - name: Package and validate release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $PWD "artifact"
          $stage = Join-Path $env:RUNNER_TEMP $env:ARTIFACT_NAME
          $archive = Join-Path $artifactRoot "$($env:ARTIFACT_NAME).zip"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $exe = Join-Path $PWD "source\target\$env:WINDOWS_TARGET\release\herdr.exe"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          $version = & $exe --version
          $expected = "^herdr [0-9]+\.[0-9]+\.[0-9]+-nightly\.$([regex]::Escape($env:HERDR_BUILD_ID))$"
          if ($LASTEXITCODE -ne 0 -or [string] $version -cnotmatch $expected) {
            throw "nightly executable identity mismatch: $version"
          }

          .\source\scripts\package_windows_conpty.ps1 `
            -HerdrExe $exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath $archive
          .\source\scripts\windows_conpty_enhanced_input_probe.ps1 `
            -ExePath (Join-Path $stage "herdr.exe") `
            -Session "nightly-bundled-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            -ExpectedConsoleHostPath (Join-Path $stage "conpty\x64\OpenConsole.exe")
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File `
            .\source\scripts\windows_install_conpty_package_test.ps1 `
            -ArchivePath $archive
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell installer test failed with exit code $LASTEXITCODE"
          }

          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$hash  $($env:ARTIFACT_NAME).zip`n"
          [IO.File]::WriteAllText("$archive.sha256", $checksum, [Text.UTF8Encoding]::new($false))
          Copy-Item -LiteralPath control\patches\delta\series -Destination (Join-Path $artifactRoot "PATCH_SERIES.txt")

      - name: Upload tested package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-win-nightly-${{ github.run_id }}
          path: |
            artifact/${{ env.ARTIFACT_NAME }}.zip
            artifact/${{ env.ARTIFACT_NAME }}.zip.sha256
            artifact/PATCH_SERIES.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true

  publish:
    name: Publish immutable Windows prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      UPSTREAM_SHA: ${{ needs.build.outputs.upstream_sha }}
      CONTROL_SHA: ${{ needs.build.outputs.control_sha }}
      BUILD_ID: ${{ needs.build.outputs.build_id }}
    steps:
      - name: Download tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: herdr-win-nightly-${{ github.run_id }}
          path: release-assets

      - name: Verify and publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          zip="${ARTIFACT_NAME}.zip"
          checksum="${zip}.sha256"
          sha256sum --check "$checksum"
          zip_digest="sha256:$(sha256sum "$zip" | awk '{print $1}')"
          checksum_digest="sha256:$(sha256sum "$checksum" | awk '{print $1}')"

          tag="windows-nightly-${UPSTREAM_SHA:0:12}-${CONTROL_SHA:0:12}"

          verify_tag_target() {
            local tag_sha
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
            if [[ "$tag_sha" != "$CONTROL_SHA" ]]; then
              echo "Tag ${tag} points to ${tag_sha}, expected ${CONTROL_SHA}." >&2
              exit 1
            fi
          }

          ensure_tag_target() {
            # Create the lightweight tag first so release creation never decides
            # its target. A pre-existing tag returns an error and is verified below.
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --field ref="refs/tags/${tag}" \
              --field sha="$CONTROL_SHA" >/dev/null 2>&1; then
              :
            fi
            verify_tag_target
          }

          verify_asset() {
            local release_json="$1"
            local name="$2"
            local expected_digest="$3"
            local count
            local state
            local digest
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
            state="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .state' <<<"$release_json")"
            digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            if [[ "$count" != "1" || "$state" != "uploaded" || "$digest" != "$expected_digest" ]]; then
              echo "Release asset ${name} is missing, duplicated, incomplete, or has the wrong digest." >&2
              exit 1
            fi
          }

          verify_release() {
            local release_json="$1"
            if [[ "$(jq -r .draft <<<"$release_json")" != "false" || \
                  "$(jq -r .prerelease <<<"$release_json")" != "true" || \
                  "$(jq '.assets | length' <<<"$release_json")" != "2" ]]; then
              echo "Release ${tag} is not the expected published prerelease." >&2
              exit 1
            fi
            verify_asset "$release_json" "$zip" "$zip_digest"
            verify_asset "$release_json" "$checksum" "$checksum_digest"
          }

          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null)"; then
            verify_tag_target
            verify_release "$release_json"
            echo "Verified existing immutable release ${tag}."
            exit 0
          fi

          ensure_tag_target

          date_utc="$(date -u +%Y-%m-%d)"
          {
            echo "Unofficial herdr-win Windows nightly built from upstream Herdr plus the maintained Windows delta."
            echo
            echo "- Upstream master: \`${UPSTREAM_SHA}\`"
            echo "- herdr-win control revision: \`${CONTROL_SHA}\`"
            echo "- Build identity: \`${BUILD_ID}\`"
            echo
            echo "Applied patches:"
            while IFS= read -r patch; do
              patch="${patch%$'\r'}"
              [[ -z "$patch" || "$patch" == \#* ]] && continue
              printf -- '- `%s`\n' "$patch"
            done < PATCH_SERIES.txt
            echo
            echo "The installed executable and command remain \`herdr\`. This is a drop-in Windows build, not an official upstream release."
          } > RELEASE_NOTES.md

          gh release create "$tag" \
            "${ARTIFACT_NAME}.zip" \
            "${ARTIFACT_NAME}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CONTROL_SHA" \
            --title "herdr-win nightly ${date_utc}" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            --latest=false

          verify_tag_target
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          verify_release "$release_json"
