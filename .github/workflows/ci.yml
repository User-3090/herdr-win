name: Patch replay

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay delta on upstream master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout herdr-win control repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: control
          persist-credentials: false

      - name: Checkout upstream Herdr
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ogulcancelik/herdr
          ref: master
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Validate patch inventories
        working-directory: control
        run: python3 -m unittest scripts.test_delta_patches scripts.test_upstream_patches

      - name: Replay maintained delta
        shell: bash
        env:
          GIT_COMMITTER_NAME: herdr-win replay
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          base="$(git -C source rev-parse HEAD)"
          while IFS= read -r patch; do
            [[ -z "$patch" || "$patch" == \#* ]] && continue
            git -C source am --3way "$GITHUB_WORKSPACE/control/patches/delta/$patch"
          done < control/patches/delta/series
          git -C source diff --check "$base..HEAD"
